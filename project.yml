# XcodeGen spec. Run `xcodegen generate` (CI does); the .xcodeproj is never committed.
name: Whydunit
options:
  deploymentTarget:
    macOS: "15.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    revision: "eef1a539a373c1f1a320624b1130fc5de7b2e100"   # Sparkle 2.10.0; a commit, not a movable tag (DECISIONS.md #11).
    # Bump on purpose in a PR, with SPARKLE, SPARKLE_REV and SPARKLE_SHA256 in release.yml (its preflight checks SPARKLE_REV)
  Whydunit:
    path: .   # this repo's Package.swift (WhydunitCore + WhydunitMac). VERIFY: Xcode accepts a local package in the project's own folder.
targets:
  Whydunit:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: Whydunit
        products:
          - WhydunitCore
          - WhydunitMac
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.whydunit.mac
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        DEAD_CODE_STRIPPING: "YES"
        # Set directly instead of `info:`/`entitlements:`, which would regenerate (overwrite) these hand-written files.
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Whydunit.entitlements
schemes:
  Whydunit:
    build:
      targets:
        Whydunit: all
