name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  XCODEGEN: "2.46.0"   # checksum-pinned, same pin as release.yml and beta.yml: bump all three together
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  # WhydunitCore is Foundation-only; on Linux Package.swift defines just the Core targets.
  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.2   # the compiler BUILD_PLAN targets (Xcode 26 ships Swift 6.2+)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift build --target WhydunitCore && swift test --filter WhydunitCoreTests

  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Safety grep (BUILD_PLAN §3)
        run: |
          hits=$(grep -rnE --include='*.swift' 'removeItem\(|unlink\(|rmdir\(|"/bin/(ba|z)?sh"|"/bin/rm"|"-c"' Sources App || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Forbidden call: delete with FileManager.trashItem, never run a shell (BUILD_PLAN §3)"
            exit 1
          fi

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version

      - run: swift test

      # Release, universal: the configuration release.yml archives.
      - name: Generate project (XcodeGen, checksum-pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP/xcodegen/share/xcodegen/SettingPresets"   # without them xcodegen only prints a warning
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      - name: Build app
        run: |
          xcodebuild -project Whydunit.xcodeproj -scheme Whydunit -configuration Release \
            -destination 'generic/platform=macOS' ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

  # Cheap repo checks from docs/BUILD_PLAN.md §9.6 (buildmac.app "what broke" lessons).
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # "Nothing shipped names your machine." /Users/Shared is macOS's, jane/you are the docs' and tests' example user.
      - name: No home paths in tracked files
        run: |
          hits=$(git ls-files -z | xargs -0 grep -noIE '/Users/[A-Za-z0-9._-]+|[A-Za-z]:[\/]+[Uu]sers[\/]+[A-Za-z0-9._-]' \
            | grep -vE ':/Users/(Shared|you|jane)$' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Personal home paths above: use ~, <scratchpad> or a repo-relative path"
            exit 1
          fi

      # "No button can do nothing." ponytail: every role: .cancel button is exempt (a dialog's Cancel dismisses
      # itself); check the enclosing modifier if an empty Cancel ever lands in a sheet.
      - name: No empty Button actions in App/
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          bad = [f"{p}:{s.count(chr(10), 0, m.start()) + 1}: {m[0]}" for p in sorted(pathlib.Path("App").rglob("*.swift"))
                 for s in [p.read_text(encoding="utf-8")] for m in re.finditer(r"\bButton\b[^{}\n]*\{\s*\}", s)
                 if "role: .cancel" not in m[0]]
          for b in bad:
              print(f"::error::Button with an empty action: {b}")
          sys.exit(1 if bad else 0)
          EOF

      # "Paste works from first launch" (BUILD_PLAN §9.5): replacing these Edit menu groups kills ⌘C and ⌘V.
      - name: Standard Edit menu kept
        run: |
          if grep -rnE 'replacing: *\.(pasteboard|textEditing)\b' App Sources; then
            echo "::error::Keep the standard Edit menu: never replace .pasteboard or .textEditing (BUILD_PLAN §9.5)"
            exit 1
          fi

      - run: python3 tools/changelog.py --self-test
      - run: python3 tools/sparkle_keys.py --self-test
      - run: python3 tools/build_site.py --check
      - run: bash tools/doctor.sh --ci

  # Non-blocking early warning against the next SDK (DECISIONS.md #13). Uses the image's default Xcode.
  xcode-27:
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcodebuild -version && swift test
      - name: Generate project (XcodeGen, checksum-pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP/xcodegen/share/xcodegen/SettingPresets"   # without them xcodegen only prints a warning
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      - name: Build app
        run: |
          xcodebuild -project Whydunit.xcodeproj -scheme Whydunit -configuration Release \
            -destination 'generic/platform=macOS' ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
